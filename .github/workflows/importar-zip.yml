name: Importar projeto ZIP
on:
  push:
    paths:
      - 'catalogos-saas-seguranca-v1.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extrair arquivos do projeto
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          archive=Path('catalogos-saas-seguranca-v1.zip')
          if not archive.exists():
              raise SystemExit('Envie catalogos-saas-seguranca-v1.zip na raiz do repositório')
          with zipfile.ZipFile(archive) as z:
              files=[i for i in z.infolist() if not i.is_dir()]
              if len(files)>2000:
                  raise SystemExit('Arquivo contém entradas demais')
              for item in files:
                  path=Path(item.filename)
                  parts=path.parts
                  if not parts or parts[0]!='catalogos-saas' or len(parts)<2:
                      raise SystemExit(f'Caminho inesperado: {item.filename}')
                  rel=Path(*parts[1:])
                  if '..' in rel.parts or '.git' in rel.parts or rel.is_absolute():
                      raise SystemExit('Caminho inseguro')
                  if item.file_size>20_000_000:
                      raise SystemExit('Arquivo grande demais')
                  target=Path('.')/rel
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(item))
          archive.unlink()
          PY
      - name: Publicar código no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Importar projeto de catálogo multiloja" && git push)
