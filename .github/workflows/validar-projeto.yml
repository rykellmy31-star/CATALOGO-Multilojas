name: Validar projeto
on:
  push:
    branches: [main, 'desenvolvimento/**']
  pull_request:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirmar importação do código
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json || { echo "::error::Código-fonte ainda não importado"; exit 1; }
          test -f package-lock.json || { echo "::error::Lockfile ausente"; exit 1; }
          test -f backend/src/routes/auth.ts || { echo "::error::API de autenticação ausente"; exit 1; }
      - name: Auditar segurança básica
        run: python3 scripts/auditar-seguranca.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Auditar dependências
        run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build
      - name: Validar migrações no D1 local
        run: npm run db:migrate
      - name: Validar empacotamento sem publicar
        run: npx wrangler deploy --dry-run --outdir /tmp/catalogo-worker
        env:
          WRANGLER_SEND_METRICS: false
      - name: Instalar navegador de testes
        run: npx playwright install --with-deps chromium
      - name: Validar fluxos no navegador e R2 local
        run: npm run test:browser
      - name: Preservar evidências de validação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validacao-navegador
          path: test-results/
          retention-days: 7
