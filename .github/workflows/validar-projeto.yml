name: Validar projeto
on:
  workflow_dispatch:
    inputs:
      navegador:
        description: Executar também Chromium e R2 local
        type: boolean
        default: false
concurrency:
  group: validar-${{ github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validar:
    name: ${{ github.event_name == 'workflow_dispatch' && !inputs.navegador && 'validar-basico-manual' || 'validar' }}
    # Never runs on push, pull_request, labels, or schedules.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirmar importação do código
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json || { echo "::error::Código-fonte ainda não importado"; exit 1; }
          test -f package-lock.json || { echo "::error::Lockfile ausente"; exit 1; }
          test -f backend/src/routes/auth.ts || { echo "::error::API de autenticação ausente"; exit 1; }
      - name: Auditar segurança básica
        run: python3 scripts/auditar-seguranca.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Auditar dependências
        run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build
      - name: Validar migrações no D1 local
        run: npm run db:migrate
      - name: Validar empacotamento sem publicar
        run: npx wrangler deploy --dry-run --env='' --outdir /tmp/catalogo-worker
        env:
          WRANGLER_SEND_METRICS: false
      - name: Instalar navegador de testes
        if: inputs.navegador
        run: npx playwright install --with-deps chromium
      - name: Validar fluxos no navegador e R2 local
        if: inputs.navegador
        run: npm run test:browser
      - name: Preservar evidências de validação
        if: always() && (inputs.navegador)
        uses: actions/upload-artifact@v4
        with:
          name: validacao-navegador
          path: test-results/
          retention-days: 7
